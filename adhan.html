<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prayer Times — Shenkar College</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0b0f1a;
      color: #e8dcc8;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Starfield / subtle radial glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(90, 60, 20, 0.35) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(20, 40, 80, 0.4) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Decorative stars */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .stars span {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      animation: twinkle var(--d, 4s) ease-in-out infinite var(--delay, 0s);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.8); }
      50% { opacity: var(--op, 0.6); transform: scale(1); }
    }

    /* Header */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 2rem;
      padding: 0 1rem;
    }

    .crescent {
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 0 18px rgba(200, 160, 80, 0.7));
    }

    header h1 {
      font-family: 'Amiri', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #f0d990;
      text-shadow: 0 0 24px rgba(240, 200, 80, 0.4);
    }

    header p {
      font-size: 0.85rem;
      font-weight: 300;
      color: #9ab0c8;
      margin-top: 0.35rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Divider */
    .divider {
      width: 160px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c8a040, transparent);
      margin: 1rem auto;
      opacity: 0.6;
    }

    /* Widget wrapper */
    .widget-wrap {
      position: relative;
      z-index: 1;
      width: min(560px, 95vw);
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(200, 160, 80, 0.18);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 8px 40px rgba(0,0,0,0.6),
        0 0 60px rgba(100, 70, 20, 0.15);
      backdrop-filter: blur(10px);
    }

    .widget-wrap iframe {
      display: block;
      width: 100%;
      height: 480px;
      border: none;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      margin-top: 2rem;
      text-align: center;
      font-size: 0.72rem;
      color: #4a5a70;
      letter-spacing: 0.08em;
    }

    footer span {
      color: #c8a040;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- Stars -->
  <div class="stars" id="stars"></div>

  <header>
    <div class="crescent">☽</div>
    <h1>Prayer Times</h1>
    <p>Shenkar College &mdash; Ramat Gan</p>
    <div class="divider"></div>
  </header>

  <div class="widget-wrap">
    <iframe
      src="//mawaqit.net/ar/w/shenkar-college-ramat-gan-52001-israel?showOnly5PrayerTimes=0"
      frameborder="0"
      scrolling="no"
    ></iframe>
  </div>

  <footer>
    Powered by <span>Mawaqit</span> &bull; May Allah accept your prayers
  </footer>

  <script>
    // Generate random stars
    const container = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('span');
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = `
        width:${size}px; height:${size}px;
        top:${Math.random()*100}%;
        left:${Math.random()*100}%;
        --d:${(Math.random()*5+3).toFixed(1)}s;
        --delay:-${(Math.random()*6).toFixed(1)}s;
        --op:${(Math.random()*0.5+0.2).toFixed(2)};
      `;
      container.appendChild(s);
    }
  </script>
</body>
</html>
